<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WWE Champions — Growth Prototype</title>
<style>
  :root{
    --bg-a:#14161d;--bg-b:#0b0c10;--panel:#181B22;--panel-2:#1F232C;--line:#2A2F3A;
    --ink:#E7E4DC;--ink-strong:#FBFAF6;--muted:#98A0AE;--faint:#6E7684;
    --gold:#EDB93E;--gold-deep:#C9922A;--red:#D23A50;--green:#2FBF6B;--blue:#3E7BC8;
    --display:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:var(--body);color:var(--ink);
    background:
      radial-gradient(1000px 600px at 82% -10%,rgba(237,185,62,.10),transparent 60%),
      radial-gradient(800px 500px at 0% 4%,rgba(210,58,80,.09),transparent 55%),
      linear-gradient(180deg,var(--bg-a),var(--bg-b) 72%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 16px 44px;gap:14px;
  }

  .masthead{width:100%;max-width:980px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;color:var(--ink-strong);font-size:1rem;display:inline-flex;gap:8px;align-items:baseline;}
  .brand b{color:var(--gold);}
  .controls{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{font-family:var(--mono);font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;transition:.15s;}
  .btn:hover{color:var(--ink-strong);border-color:var(--gold-deep);}
  .btn.on{color:var(--gold);border-color:color-mix(in oklab,var(--gold) 55%,var(--line));background:color-mix(in oklab,var(--gold) 10%,transparent);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .frameline{width:100%;max-width:980px;text-align:center;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
  .frameline b{color:var(--gold);}

  /* two-column: phone + context rail */
  .app{display:grid;grid-template-columns:auto minmax(0,320px);gap:26px;align-items:start;justify-items:center;}
  @media (max-width:880px){ .app{grid-template-columns:1fr;} }

  .stage{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .dots{display:flex;gap:8px;align-items:center;height:18px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);border:1px solid #333;cursor:pointer;transition:.2s;padding:0;}
  .dot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(237,185,62,.22);}
  .dot.done{background:color-mix(in oklab,var(--gold) 45%,var(--line));}

  /* phone */
  .phone{position:relative;width:min(348px,88vw);aspect-ratio:1206/2622;border-radius:36px;border:1px solid var(--line);background:#0a0b0e;overflow:hidden;box-shadow:0 26px 64px rgba(0,0,0,.6),0 0 0 8px #050609;}
  .phone.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97);}
  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
  .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:100px;height:21px;background:#050609;border-radius:0 0 14px 14px;z-index:30;}
  .g-status{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#e9e9ee;font-size:10px;font-family:var(--mono);background:#0a0b0e;position:relative;z-index:5;}
  .g-top{display:flex;align-items:center;gap:6px;padding:7px 10px;background:linear-gradient(180deg,#20232b,#15171d);border-bottom:1px solid #000;position:relative;z-index:5;}
  .g-back{width:22px;height:22px;border-radius:6px;border:1px solid #3a3f49;background:#22262e;color:#cbd2dc;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .g-hex{font-family:var(--display);font-style:italic;font-weight:900;font-size:12px;color:#fff;background:#33373f;border:1px solid #4a4f59;border-radius:4px;padding:2px 9px;}
  .g-chip{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:#f0e6cf;background:#12141a;border:1px solid #2b2f38;border-radius:999px;padding:2px 9px;}
  .g-chip .c{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d270,#c98f22);}
  .g-chip.cash .c{background:linear-gradient(#8fd06a,#3f8f2f);border-radius:2px;}

  .g-screen{position:absolute;top:26px;bottom:50px;left:0;right:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#241017 0%,#0c0d11 55%);}
  .g-screen .layer{position:absolute;inset:0 0 16px 0;overflow-y:auto;}
  .layer.in-fwd{animation:slideR .32s ease;}
  .layer.in-back{animation:slideL .32s ease;}
  @keyframes slideR{from{transform:translateX(28px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes slideL{from{transform:translateX(-28px);opacity:0;}to{transform:translateX(0);opacity:1;}}

  /* scrolling chat ticker like the real game */
  .g-ticker{position:absolute;left:0;right:0;bottom:50px;height:16px;background:#0c0d11;border-top:1px solid #1c1f26;overflow:hidden;z-index:12;display:flex;align-items:center;}
  .g-ticker .track{white-space:nowrap;font-family:var(--mono);font-size:8.5px;color:#8a92a0;padding-left:100%;animation:mar 16s linear infinite;}
  .g-ticker .track b{color:#c9a24a;}
  @keyframes mar{to{transform:translateX(-100%);}}

  .g-nav{position:absolute;bottom:0;left:0;right:0;height:50px;display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#181b22,#0d0e12);border-top:1px solid #000;z-index:15;}
  .g-nav div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--mono);font-size:7.5px;letter-spacing:.04em;color:#8b93a1;text-transform:uppercase;}
  .g-nav div .ic{width:17px;height:13px;border:1.4px solid #6b7280;border-radius:3px;}
  .g-nav div.lock .ic{border-color:#5a5040;background:repeating-linear-gradient(45deg,#3a3320 0 3px,transparent 3px 6px);}
  .g-nav div.lock{color:#6a6250;}
  .g-nav div.active{color:var(--gold);}
  .g-nav div.active .ic{border-color:var(--gold);}
  .g-nav div.pop .ic{animation:navpop .5s ease;}
  @keyframes navpop{0%{transform:scale(1);}40%{transform:scale(1.4);border-color:var(--gold);}100%{transform:scale(1);}}

  .g-pad{padding:14px;display:flex;flex-direction:column;gap:11px;min-height:100%;}
  .g-banner{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;color:#fff;font-size:17px;text-align:center;letter-spacing:-.01em;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  .g-sub{font-size:11px;color:#c9c2b5;text-align:center;line-height:1.45;}
  .g-card{border-radius:11px;border:1px solid #3a2130;background:linear-gradient(180deg,#2a1220,#170a12);padding:11px;text-align:center;position:relative;box-shadow:inset 0 0 26px rgba(210,58,80,.18);overflow:hidden;}
  .g-card.shine::after{content:"";position:absolute;top:-60%;left:-30%;width:40%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(18deg);animation:shine 3.2s ease-in-out infinite;}
  @keyframes shine{0%{left:-40%;}55%,100%{left:130%;}}
  .g-portrait{height:112px;border-radius:9px;background:radial-gradient(60% 50% at 50% 30%,rgba(237,185,62,.4),transparent 70%),linear-gradient(180deg,#3b2b1a,#241a12);border:1px solid #574126;display:flex;align-items:flex-end;justify-content:center;position:relative;}
  .g-portrait .who{font-family:var(--display);font-style:italic;font-weight:900;font-size:13px;color:#fff;padding-bottom:9px;text-shadow:0 1px 4px #000;z-index:2;}
  .g-star{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:#f3d270;}
  .g-star::before{content:"★";color:#f3d270;font-size:12px;}
  .g-guar{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#9be3b5;background:rgba(47,191,107,.16);border:1px solid rgba(47,191,107,.5);border-radius:999px;padding:3px 9px;display:inline-block;margin-top:7px;}
  .g-board{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .g-gem{aspect-ratio:1;border-radius:4px;border:none;padding:0;cursor:pointer;transition:transform .08s;}
  .g-gem:active{transform:scale(.86);}
  .g-gem.pop{animation:gempop .32s ease;}
  @keyframes gempop{0%{transform:scale(1);}40%{transform:scale(1.35);filter:brightness(1.6);}100%{transform:scale(1);}}
  .g-gem.sel{outline:2px solid #fff;outline-offset:-2px;box-shadow:0 0 0 2px #f3d270,0 0 12px #f3d270;z-index:3;}
  .g-gem.clearing{animation:clr .2s ease forwards;}
  @keyframes clr{to{transform:scale(.12);opacity:0;}}
  .g-gem.drop{animation:drop .24s ease;}
  @keyframes drop{from{transform:translateY(-18px);opacity:.3;}to{transform:translateY(0);opacity:1;}}
  .g-gem.bad{animation:badwig .3s ease;}
  @keyframes badwig{20%{transform:translateX(-4px);}60%{transform:translateX(4px);}100%{transform:translateX(0);}}

  /* before/after mode switch */
  .modeswitch{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:3px;gap:3px;}
  .modeswitch button{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:999px;padding:7px 15px;cursor:pointer;color:var(--muted);background:transparent;transition:.15s;}
  .modeswitch button.on[data-m="before"]{background:color-mix(in oklab,var(--red) 22%,var(--panel));color:#ff9a9a;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--red) 55%,transparent);}
  .modeswitch button.on[data-m="after"]{background:color-mix(in oklab,var(--green) 22%,var(--panel));color:#9be3b5;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--green) 55%,transparent);}

  /* status ribbon inside the phone */
  .g-ribbon{position:absolute;top:0;left:0;right:0;z-index:14;text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px;}
  .g-ribbon.before{background:linear-gradient(180deg,rgba(210,58,80,.95),rgba(160,30,55,.9));color:#fff;}
  .g-ribbon.after{background:linear-gradient(180deg,rgba(47,150,90,.9),rgba(30,110,65,.85));color:#eafff0;}
  .before-fix{margin-top:auto;font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:13px;color:#eafff0;background:linear-gradient(180deg,#2f9a53,#1c6a39);border:1px solid #47c07a;border-radius:9px;padding:11px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #14522c;}
  .before-fix:active{transform:translateY(2px);box-shadow:0 2px 0 #14522c;}
  .g-prob{border:1px solid #5a2030;background:rgba(210,58,80,.1);border-radius:9px;padding:9px 10px;font-size:9.5px;color:#ffbfc7;line-height:1.45;}
  .g-prob b{color:#ff8a97;}
  .g-tab{display:flex;gap:4px;}
  .g-tab .t{flex:1;text-align:center;font-family:var(--mono);font-size:7px;letter-spacing:.05em;text-transform:uppercase;padding:5px 2px;border-radius:5px;border:1px solid #3a2130;color:#c99;background:#1a0e15;}
  .g-crumb{display:flex;flex-wrap:wrap;gap:4px;}
  .g-crumb span{font-family:var(--mono);font-size:8px;color:#c9a24a;border:1px solid #4a3a20;border-radius:5px;padding:3px 6px;background:#161208;}

  /* embedded real screenshot (Before view) */
  .g-shotwrap{position:absolute;top:22px;left:0;right:0;bottom:0;display:flex;flex-direction:column;}
  .g-shot{flex:1;width:100%;min-height:0;object-fit:cover;object-position:top center;cursor:zoom-in;background:#000;}
  .g-shot-band{background:rgba(150,26,44,.94);color:#fff;font-size:9.5px;line-height:1.4;padding:8px 11px;}
  .g-shot-band b{color:#ffd0d6;}
  .g-shot-band .shotref{display:block;margin-top:4px;font-family:var(--mono);font-size:7.5px;letter-spacing:.06em;color:#ffb3bd;text-transform:uppercase;}
  .g-shotwrap .before-fix{margin-top:0;border-radius:0;}

  /* rail thumbnail */
  .rc-shot{margin-top:9px;display:block;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;position:relative;background:#000;}
  .rc-shot img{display:block;width:100%;height:120px;object-fit:cover;object-position:top center;}
  .rc-shot .tag{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(150,26,44,.9);padding:2px 6px;border-radius:4px;}
  .rc-shot .zoom{position:absolute;right:6px;top:6px;font-size:.6rem;color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:2px 5px;}

  /* lightbox */
  #lightbox{position:fixed;inset:0;background:rgba(5,6,9,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;cursor:zoom-out;flex-direction:column;gap:12px;}
  #lightbox.on{display:flex;}
  #lightbox img{max-width:100%;max-height:88vh;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.7);border:1px solid #333;}
  #lightbox .lb-cap{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:#c9a24a;}
  .rG{background:linear-gradient(180deg,#ff5a5a,#c0263a);}.bG{background:linear-gradient(180deg,#4aa8ff,#1f5fc0);}
  .gG{background:linear-gradient(180deg,#5fd06a,#2f8f3a);}.yG{background:linear-gradient(180deg,#ffd24a,#c98f22);}
  .pG{background:linear-gradient(180deg,#b06aff,#6a2fc0);}.kG{background:linear-gradient(180deg,#3a3550,#211d33);}
  .g-vs{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9px;color:#cbb;}
  .g-hp{height:8px;border-radius:4px;background:#3a1420;border:1px solid #5a2030;overflow:hidden;flex:1;margin:0 6px;}
  .g-hp span{display:block;height:100%;background:linear-gradient(90deg,#7fe06a,#3f9a2f);transition:width .5s ease;}
  .g-hp.foe span{background:linear-gradient(90deg,#ff6a6a,#c0263a);}
  .g-fin{background:#12141a;border:1px solid #2b2f38;border-radius:8px;padding:8px;}
  .g-fin .t{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:#f0d68a;margin-bottom:5px;display:flex;justify-content:space-between;}
  .g-finbar{height:11px;border-radius:6px;background:#0c0d11;border:1px solid #3a3320;overflow:hidden;}
  .g-finbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#f3cf6a,#ff5a5a);transition:width .28s ease;}
  .g-coach{border:1px dashed rgba(237,185,62,.55);background:rgba(237,185,62,.08);border-radius:9px;padding:9px 10px;font-size:10px;color:#f0e2c0;line-height:1.45;}
  .g-coach b{color:#f3d270;}
  .g-note{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:#7f8895;text-align:center;text-transform:uppercase;border:1px solid #262b34;border-radius:7px;padding:6px;background:#0e1015;}
  .g-victory{font-family:var(--display);font-style:italic;font-weight:900;font-size:32px;text-transform:uppercase;text-align:center;color:#f3d270;text-shadow:0 2px 12px rgba(237,185,62,.5);letter-spacing:-.02em;animation:vpop .5s ease;}
  @keyframes vpop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
  .g-stars{text-align:center;font-size:18px;letter-spacing:5px;}
  .g-stars b{color:#f3d270;display:inline-block;animation:starpop .4s backwards;}
  .g-stars b:nth-child(1){animation-delay:.2s;}.g-stars b:nth-child(2){animation-delay:.4s;color:#5a5040;}.g-stars b:nth-child(3){animation-delay:.6s;color:#5a5040;}
  @keyframes starpop{0%{transform:scale(0) rotate(-40deg);}70%{transform:scale(1.4);}100%{transform:scale(1);}}
  .g-reward{display:flex;justify-content:center;gap:16px;}
  .g-reward div{text-align:center;font-family:var(--mono);font-size:9px;color:#cfc;}
  .g-reward .ic{width:34px;height:34px;border-radius:7px;margin:0 auto 4px;background:linear-gradient(180deg,#33373f,#1a1c22);border:1px solid #4a4f59;}
  .g-list{display:flex;flex-direction:column;gap:6px;}
  .g-row{display:flex;align-items:center;gap:8px;background:#14161d;border:1px solid #262b34;border-radius:8px;padding:7px 8px;font-size:10px;color:#dfd8cb;}
  .g-av{width:24px;height:24px;border-radius:6px;background:linear-gradient(180deg,#3b2b1a,#241a12);border:1px solid #574126;flex:0 0 auto;}
  .g-av.mentor{background:linear-gradient(180deg,#f3cf6a,#c98f22);border-color:#a8791c;}
  .g-badge{margin-left:auto;font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:#9be3b5;border:1px solid rgba(47,191,107,.5);border-radius:999px;padding:2px 7px;}
  .g-badge.m{color:#f3d270;border-color:rgba(237,185,62,.5);}
  .g-goal{background:#12141a;border:1px solid #2b2f38;border-radius:9px;padding:9px;}
  .g-goal .t{font-size:9.5px;color:#c9c2b5;margin-bottom:6px;}
  .g-bar{height:10px;border-radius:6px;background:#0c0d11;border:1px solid #2b2f38;overflow:hidden;}
  .g-bar span{display:block;height:100%;background:linear-gradient(90deg,#f3cf6a,#d29a26);}
  .g-missionbars{display:flex;gap:6px;}
  .g-mb{flex:1;background:#0e1015;border:1px solid #262b34;border-radius:6px;padding:5px 6px;}
  .g-mb .l{font-family:var(--mono);font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:#8b93a1;}
  .g-mb .b{height:6px;margin-top:3px;border-radius:4px;background:#000;overflow:hidden;}
  .g-mb .b span{display:block;height:100%;background:linear-gradient(90deg,#f3cf6a,#d29a26);}
  .g-leaguebadge{width:52px;height:56px;margin:0 auto;border-radius:8px;background:linear-gradient(180deg,#2b4a8a,#16233f);border:1px solid #3e6bb0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;color:#fff;position:relative;box-shadow:0 0 16px rgba(62,123,200,.4);}

  .g-cta{margin-top:auto;font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;font-size:14px;color:#132a10;background:linear-gradient(180deg,#7fe06a,#3f9a2f);border:1px solid #2f7a22;border-radius:9px;padding:12px;text-align:center;box-shadow:0 4px 0 #275f18;cursor:pointer;user-select:none;position:relative;overflow:hidden;animation:pulse 2s infinite;}
  .g-cta.gold{color:#241a06;background:linear-gradient(180deg,#f3cf6a,#d29a26);border-color:#a8791c;box-shadow:0 4px 0 #8a6114;}
  .g-cta.dim{filter:grayscale(.7) brightness(.6);animation:none;cursor:default;}
  .g-cta:active{transform:translateY(2px);box-shadow:0 2px 0 #275f18;}
  .g-cta.gold:active{box-shadow:0 2px 0 #8a6114;}
  @keyframes pulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.15);}}
  @media (prefers-reduced-motion:reduce){.g-cta,.g-card.shine::after,.g-ticker .track{animation:none;}}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .5s ease-out;pointer-events:none;}
  @keyframes rip{to{transform:scale(4);opacity:0;}}

  /* floating damage number */
  .dmg{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;color:#ff5a5a;text-shadow:0 2px 8px #000;z-index:20;pointer-events:none;animation:dmgfloat 1s ease forwards;}
  @keyframes dmgfloat{0%{transform:translate(-50%,10px) scale(.6);opacity:0;}25%{opacity:1;transform:translate(-50%,-8px) scale(1.15);}100%{transform:translate(-50%,-48px) scale(1);opacity:0;}}
  #confetti{position:absolute;inset:0;z-index:18;pointer-events:none;}

  /* annotation caps */
  .cap{position:absolute;z-index:20;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#241a06;font-family:var(--mono);font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(237,185,62,.25),0 2px 6px rgba(0,0,0,.5);}
  body:not(.show-ann) .cap{display:none;}

  /* hub */

let AC=null, soundOn=true;
function beep(type){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    const specs = type==='win' ? [[523,0],[659,.08],[784,.16],[1046,.24]]
                : type==='hit' ? [[180,0]]
                : type==='unleash' ? [[110,0],[90,.05]]
                : [[440,0]];
    specs.forEach(([f,d])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type = type==='hit'||type==='unleash' ? 'sawtooth':'triangle';
      o.frequency.value=f;
      o.connect(g); g.connect(AC.destination);
      const s=t+d;
      g.gain.setValueAtTime(.0001,s);
      g.gain.exponentialRampToValueAtTime(type==='tap'?.14:.2,s+.01);
      g.gain.exponentialRampToValueAtTime(.0001,s+(type==='win'?.18:.14));
      o.start(s); o.stop(s+.2);
    });
  }catch(e){}
}

/* real screenshots that back each "before" moment (null = no live screenshot exists) */
const SHOTS = {
  debut:['IMG_0821.PNG','IMG_0841.PNG','IMG_0829.PNG','IMG_0818.PNG'],
  social:['IMG_0832.PNG','IMG_0836.PNG',null]
};
const PROB = {

    'a $99.99 offer at League 2, and a roster of random C-tier stars — money asked before a single win.',
    'the very first match already exposes Boss Breakers, gear and crit stats — and can dead-end in "rescue for 100 cash".',

function beforeBody(){
  const shot=SHOTS[flowKey] && SHOTS[flowKey][idx];
  if(shot){
    const ref=shot.replace('.PNG','');
    return `<div class="g-shotwrap">
      <img class="g-shot" src="shots/${shot}" alt="Live game screenshot ${ref}" data-shot="${shot}" data-ref="${ref}">
      <div class="g-shot-band"><b>The problem:</b> ${PROB[flowKey][idx]}<span class="shotref">${ref} · real screenshot — tap to enlarge</span></div>
      <div class="before-fix" data-fix>▶ See how we fixed it</div>

  }
  return BEFORE[flowKey][idx];   // fallback mock (no live screenshot exists)
}
function openLightbox(src,cap){ $('#lbimg').src=src; $('#lbcap').textContent=cap||''; $('#lightbox').classList.add('on'); }

/* ---------- state ---------- */
let flowKey=null, flow=null, idx=0, dir='fwd', mode='after';
const $=s=>document.querySelector(s);
const screenEl=$('#screen'),topEl=$('#topbar'),navEl=$('#nav'),dotsEl=$('#dots'),capEl=$('#caption'),railEl=$('#rail'),tickEl=$('#ticker').firstElementChild,phoneEl=$('#phone');

function renderHub(){
  flowKey=null;flow=null;mode='after';
  $('#modeswitch').style.display='none';$('#ribbon').style.display='none';
  dotsEl.innerHTML='';tickEl.innerHTML=TICK.debut;
  screenEl.style.paddingTop='0';
  topEl.innerHTML=`<div class="g-back" style="opacity:.25">‹</div><span class="g-hex">✦</span><span class="g-chip"><span class="c"></span>—</span>`;
  navEl.innerHTML=NAVB(-1,[]);
  screenEl.className='layer';
  screenEl.innerHTML=`<div class="hub">
    <div class="kick">Growth · Activation bets</div>
    <h1>Pick a flow<br>to play</h1>
    <p>Walk a real new-player experience. Tap the glowing button — or match gems — to advance.</p>
    <button class="flowbtn" data-flow="debut"><span class="fn">1</span><span><span class="ft">The Debut</span><span class="fd">Guided first session · deferred systems</span></span><span class="ice">60</span></button>
    <button class="flowbtn" data-flow="social"><span class="fn">2</span><span><span class="ft">Social On-ramp</span><span class="fd">Rookie Crew before League 5</span></span><span class="ice">60</span></button>
  </div>`;
  capEl.innerHTML=`<div class="ct">Flow picker</div><div class="cd">Two main-event activation bets — choose one to walk through.</div>`;
  railEl.innerHTML=`<div class="railcard"><div class="rc-body">
    <div class="rc-title">What am I looking at?</div>
    <div class="rc-why">A clickable, game-skinned walkthrough of the two highest-ICE activation bets from the growth deck. Each screen pairs the <b>proposed UX</b> with the <b>live-game problem</b> it fixes, the primary KPI, and the revenue guardrail — so it doubles as the talking track for the room.</div>
    <div class="rc-block rc-today"><span class="h">How to present</span>Play a flow end-to-end, then use the ◉ Annotations toggle to reveal the numbered design rationale on each screen.</div>
    <div class="rc-hint">Pick a flow to begin →</div>
  </div></div>`;
  screenEl.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{beep('tap');startFlow(b.dataset.flow);});
}

function startFlow(k){flowKey=k;flow=FLOWS[k];idx=0;dir='fwd';mode='after';tickEl.innerHTML=TICK[k];render();}

function render(){
  const s=flow.screens[idx];
  const hasBefore=!!(BEFORE[flowKey] && BEFORE[flowKey][idx]);
  const showBefore=hasBefore && mode==='before';

  topEl.innerHTML=`<div class="g-back" id="gback">‹</div>
    <span class="g-hex">${s.top.hex}</span>
    <span class="g-chip"><span class="c"></span>${s.top.coin}</span>
    <span class="g-chip cash"><span class="c"></span>${s.top.cash}</span>`;
  navEl.innerHTML=s.nav;
  $('#gback').onclick=()=>{beep('tap'); if(showBefore){mode='after';render();return;} if(idx>0){dir='back';mode='after';idx--;render();} else renderHub();};

  // mode switch + in-phone ribbon
  const ms=$('#modeswitch'); ms.style.display='inline-flex';
  const bB=ms.querySelector('[data-m="before"]'), aB=ms.querySelector('[data-m="after"]');
  bB.disabled=!hasBefore; bB.classList.toggle('on',showBefore); aB.classList.toggle('on',!showBefore);
  const rb=$('#ribbon'); rb.style.display='block';
  rb.className='g-ribbon '+(showBefore?'before':'after');
  rb.textContent=showBefore?'⚠ Live game today — the problem':'✓ Proposed fix';

  screenEl.className='layer '+(dir==='fwd'?'in-fwd':'in-back');
  screenEl.style.paddingTop='22px';

  if(showBefore){
    screenEl.innerHTML=beforeBody();
    const fx=screenEl.querySelector('[data-fix]'); if(fx) fx.onclick=e=>{ripple(e,fx);beep('win');mode='after';dir='fwd';render();};
    const shotImg=screenEl.querySelector('.g-shot'); if(shotImg) shotImg.onclick=()=>openLightbox(shotImg.src, shotImg.dataset.ref+' · live game today');
    capEl.innerHTML=`<div class="ct">${flow.name} · ${idx+1}/${flow.screens.length} — Before (real screenshot)</div><div class="cd">This is the live game today — tap the screenshot to enlarge, then “See how we fixed it”.</div>`;
  } else {
    const ctaHtml = s.cta.match ? `<div class="g-cta dim" id="cta">${s.cta.label}</div>` : `<div class="g-cta ${s.cta.gold?'gold':''}" id="cta">${s.cta.label}</div>`;
    const caps=(s.caps||[]).map(c=>`<span class="cap" style="left:${c.x};${c.b?`bottom:${c.b};`:`top:${c.t};`}">${c.n}</span>`).join('');
    screenEl.innerHTML=s.body.replace('{{CTA}}',ctaHtml)+caps;
    capEl.innerHTML=`<div class="ct">${flow.name} · ${idx+1}/${flow.screens.length} — ${s.title}</div><div class="cd">${hasBefore?'Toggle <b>Before</b> above to see the live-game problem · ':''}Tap ${s.cta.match?'and swap gems':'the glowing button'} to continue.</div>`;
    if(s.type==='match') wireMatch();
    else {
      if(s.type==='victory'){ beep('win'); burstConfetti(); countUps(); }
      else if(s.type==='card'){ beep('tap'); }
      const cta=$('#cta'); cta.onclick=(e)=>{ ripple(e,cta); advance(s); };
    }
  }

  // dots
  dotsEl.innerHTML=flow.screens.map((_,i)=>`<button class="dot ${i===idx?'on':i<idx?'done':''}" data-i="${i}"></button>`).join('');
  dotsEl.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{dir=(+d.dataset.i>idx)?'fwd':'back';mode='after';idx=+d.dataset.i;render();});
  // rail always carries the fix context
  renderRail(s);
  const active=[...navEl.children].findIndex(n=>n.classList.contains('active'));
  if(active>=0 && !showBefore) navEl.children[active].classList.add('pop');
}

function advance(s){
  beep('tap'); mode='after';
  if(s.cta.end){ startFlow(flowKey); return; }
  if(idx<flow.screens.length-1){ dir='fwd'; idx++; render(); }
}

function renderRail(s){
  const shot=SHOTS[flowKey] && SHOTS[flowKey][idx];
  const ref=shot?shot.replace('.PNG',''):'';
  const thumb=shot?`<div class="rc-shot" data-shot="${shot}" data-ref="${ref}"><img src="shots/${shot}" alt="Live game ${ref}"><span class="tag">Live: ${ref}</span><span class="zoom">⤢</span></div>`:'';
  railEl.innerHTML=`<div class="railcard">
    <div class="rc-top"><span class="rc-stage">${flow.stage} · ${flow.name}</span>
      <div class="rc-ice"><div class="l">ICE</div><div class="v">${flow.ice}</div></div></div>
    <div class="rc-body">
      <div class="rc-title">${s.title}</div>
      <div class="rc-why">${s.why}</div>
      <div class="rc-block rc-today"><span class="h">In the live game today</span>${s.today}${thumb}</div>
      <div class="rc-metrics">
        <div class="m"><div class="l">Primary KPI</div><div class="v g">${s.kpi}</div></div>
        <div class="m"><div class="l">Guardrail</div><div class="v r">${s.guard}</div></div>
      </div>
    </div>
  </div>`;
  const rs=railEl.querySelector('.rc-shot');
  if(rs) rs.onclick=()=>openLightbox('shots/'+rs.dataset.shot, rs.dataset.ref+' · live game today');
}

/* ---------- interactive match ---------- */
/* real Bejeweled-style swap-to-match engine */
function wireMatch(){
  const C=7, R=6, COLORS=['rG','bG','gG','yG','pG'];
  const rnd=()=>Math.floor(Math.random()*COLORS.length);
  const board=$('#board'), finbar=$('#finbar'), fintxt=$('#fintxt'), foehp=$('#foehp'), foenum=$('#foenum'), cta=$('#cta');
  let grid=[], sel=null, animating=false, charge=0, hpMax=4200, hp=4200, won=false;

  function make(){
    grid=[];
    for(let r=0;r<R;r++){grid[r]=[];for(let c=0;c<C;c++){
      let v; do{ v=rnd(); }while(
        (c>=2 && grid[r][c-1]===v && grid[r][c-2]===v) ||
        (r>=2 && grid[r-1][c]===v && grid[r-2][c]===v) );
      grid[r][c]=v;
    }}
  }
  function draw(drop){
    let h='';
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const s=(sel&&sel.r===r&&sel.c===c)?'sel':'';
      h+=`<button class="g-gem ${COLORS[grid[r][c]]} ${s} ${drop?'drop':''}" data-r="${r}" data-c="${c}"></button>`;
    }
    board.innerHTML=h;
  }
  const cell=(r,c)=>board.children[r*C+c];
  function findMatches(g){
    const marked=new Set();
    for(let r=0;r<R;r++){let run=1;for(let c=1;c<=C;c++){
      if(c<C && g[r][c]===g[r][c-1] && g[r][c]!==null) run++;
      else{ if(run>=3)for(let k=1;k<=run;k++)marked.add(r+','+(c-k)); run=1; }
    }}
    for(let c=0;c<C;c++){let run=1;for(let r=1;r<=R;r++){
      if(r<R && g[r][c]===g[r-1][c] && g[r][c]!==null) run++;
      else{ if(run>=3)for(let k=1;k<=run;k++)marked.add((r-k)+','+c); run=1; }
    }}
    return marked;
  }
  function gravity(){
    for(let c=0;c<C;c++){
      const keep=[];
      for(let r=0;r<R;r++) if(grid[r][c]!==null) keep.push(grid[r][c]);
      const need=R-keep.length, col=[];
      for(let i=0;i<need;i++) col.push(rnd());
      const full=col.concat(keep);
      for(let r=0;r<R;r++) grid[r][c]=full[r];
    }
  }
  const swapVals=(a,b)=>{const t=grid[a.r][a.c];grid[a.r][a.c]=grid[b.r][b.c];grid[b.r][b.c]=t;};

  function onGem(r,c){
    if(!sel){ sel={r,c}; draw(false); beep('tap'); return; }
    if(sel.r===r && sel.c===c){ sel=null; draw(false); return; }
    if(Math.abs(sel.r-r)+Math.abs(sel.c-c)===1){ const a=sel; sel=null; trySwap(a,{r,c}); }
    else { sel={r,c}; draw(false); beep('tap'); }
  }
  function trySwap(a,b){
    animating=true; swapVals(a,b);
    if(findMatches(grid).size===0){          // illegal — revert with a wiggle
      swapVals(a,b); draw(false); beep('hit');
      const ea=cell(a.r,a.c), eb=cell(b.r,b.c);
      if(ea)ea.classList.add('bad'); if(eb)eb.classList.add('bad');
      setTimeout(()=>{ animating=false; },300);
    } else { beep('hit'); draw(false); setTimeout(resolve,150); }
  }
  function resolve(){
    const m=findMatches(grid);
    if(m.size===0){ animating=false; return; }
    m.forEach(k=>{const[r,c]=k.split(',').map(Number);const el=cell(r,c);if(el)el.classList.add('clearing');});
    cleared(m.size);
    setTimeout(()=>{
      m.forEach(k=>{const[r,c]=k.split(',').map(Number);grid[r][c]=null;});
      gravity(); draw(true);
      if(!won) setTimeout(resolve,170);
    },200);
  }
  function cleared(n){
    charge=Math.min(100,charge+n*7); finbar.style.width=charge+'%'; fintxt.textContent=charge+'%';
    hp=Math.max(0,hp-n*150); if(foehp)foehp.style.width=(hp/hpMax*100)+'%'; if(foenum)foenum.textContent=hp;
    beep('hit');
    if(charge>=100 && !won && cta){ cta.className='g-cta gold'; cta.textContent='UNLEASH FINISHER ▶'; cta.onclick=e=>{ripple(e,cta);win('FINISHER!');}; }
    if(hp<=0 && !won){ win('K.O.!'); }
  }
  function win(txt){
    won=true; animating=true; beep('unleash');
    phoneEl.classList.remove('shake');void phoneEl.offsetWidth;phoneEl.classList.add('shake');
    if(foehp)foehp.style.width='0%';
    const d=document.createElement('div');d.className='dmg';d.textContent=txt;screenEl.appendChild(d);
    setTimeout(()=>{ dir='fwd'; idx++; render(); }, 900);
  }

  make(); draw(false);
  board.onclick=e=>{ const b=e.target.closest('.g-gem'); if(!b||animating||won) return; onGem(+b.dataset.r,+b.dataset.c); };
}

/* ---------- juice ---------- */
function ripple(e,el){
  const r=document.createElement('span');r.className='ripple';
  const b=el.getBoundingClientRect();const size=Math.max(b.width,b.height);
  r.style.width=r.style.height=size+'px';
  r.style.left=((e.clientX||b.left+b.width/2)-b.left-size/2)+'px';
  r.style.top=((e.clientY||b.top+b.height/2)-b.top-size/2)+'px';
  el.appendChild(r);setTimeout(()=>r.remove(),500);
}
function countUps(){
  screenEl.querySelectorAll('[data-count]').forEach(el=>{
    const target=+el.dataset.count;let cur=0;const steps=28;const inc=target/steps;let i=0;
    const t=setInterval(()=>{ i++;cur=Math.min(target,Math.round(inc*i));
      el.textContent=cur.toLocaleString(); if(i>=steps){clearInterval(t);el.textContent=target.toLocaleString();} },22);
  });
}
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
function sizeCv(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;}
function burstConfetti(){
  sizeCv();const cols=['#f3d270','#ff5a5a','#ffffff','#5fd06a','#4aa8ff'];parts=[];
  for(let i=0;i<70;i++){parts.push({x:cv.width/2,y:cv.height*0.28,vx:(Math.random()-.5)*7,vy:Math.random()*-7-2,g:.22,s:3+Math.random()*4,c:cols[i%cols.length],r:Math.random()*6,life:60+Math.random()*30});}
  if(raf)cancelAnimationFrame(raf);tickConfetti();
}
function tickConfetti(){
  cx.clearRect(0,0,cv.width,cv.height);let alive=false;
  parts.forEach(p=>{ if(p.life<=0)return;alive=true;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,p.life/40);
    cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);cx.restore(); });
  if(alive)raf=requestAnimationFrame(tickConfetti);else cx.clearRect(0,0,cv.width,cv.height);
}

/* ---------- controls ---------- */
$('#homeBtn').onclick=()=>{beep('tap');renderHub();};
$('#restartBtn').onclick=()=>{if(flow){beep('tap');idx=0;dir='back';render();}};
$('#annBtn').onclick=function(){beep('tap');document.body.classList.toggle('show-ann');this.classList.toggle('on');};
$('#soundBtn').onclick=function(){soundOn=!soundOn;this.classList.toggle('on',soundOn);if(soundOn)beep('tap');};
$('#modeswitch [data-m="before"]').onclick=function(){if(this.disabled||!flow)return;mode='before';dir='fwd';beep('tap');render();};
$('#modeswitch [data-m="after"]').onclick=function(){if(!flow)return;mode='after';beep('tap');render();};

$('#lightbox').onclick=function(){this.classList.remove('on');};

function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
tick();setInterval(tick,10000);
window.addEventListener('resize',()=>{if(parts.length)sizeCv();});

renderHub();
</script>
